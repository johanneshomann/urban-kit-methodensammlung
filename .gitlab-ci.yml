# Minimal pipeline for the Open CoDE mirror: Payload type generation + type
# check + REUSE licence lint. No automated tests yet (see docs/DEVELOPMENT.md).

stages: [check]

typecheck:
  stage: check
  image: node:22
  services:
    - name: mongo:7
      alias: mongodb
  variables:
    MONGODB_URI: mongodb://mongodb:27017/urban-kit-ci
    PAYLOAD_SECRET: ci-only-secret-not-used-in-production-32
    NEXT_PUBLIC_SERVER_URL: http://localhost:3000
  cache:
    key: npm-$CI_COMMIT_REF_SLUG
    paths: [.npm/]
  script:
    - npm ci --cache .npm --prefer-offline
    - npm run generate:types
    - npx tsc --noEmit

reuse:
  stage: check
  image:
    name: fsfe/reuse:latest
    entrypoint: [""]
  script:
    - reuse lint
